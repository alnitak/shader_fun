name: shader_fun
description: >-
  Run and experiment with Shadertoy GLSL shaders in Flutter. Features
  multi-pass ping-pong buffers, audio/mic reactive visualizers, and live
  interactive widget textures.
version: 0.1.0
homepage: https://github.com/alnitak/shader_fun
maintainer: Marco Bavagnoli (@alnitak)
platforms:
  android:  
  ios:
  linux:
  macos:
  windows:
  web:
topics:
  - shaders
  - shadertoy

environment:
  sdk: ^3.13.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_recorder: ^2.0.4
    # path: ../flutter_recorder
  flutter_scene: ^0.23.0
    # path: ../../tmp/flutter_scene/packages/flutter_scene
  flutter_soloud: ^5.1.1
    # path: ../flutter_soloud
  flat_buffers: ^25.9.23
  hooks: ^2.2.0
  image: ^4.10.1
  listen: ^1.0.1
  vector_math: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Waiting for flutter_scene 0.24.0 to remove this
  code_assets: ^2.0.0

flutter:
  assets:
    - flutter_scene_generated/
