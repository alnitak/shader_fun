name: shader_fun
description: >-
  Run and experiment with Shadertoy GLSL shaders in Flutter. Features
  multi-pass ping-pong buffers, audio/mic reactive visualizers, and live
  interactive widget textures.
version: 0.2.0
homepage: https://github.com/alnitak/shader_fun
maintainer: Marco Bavagnoli (@alnitak)
platforms:
  android:  
  ios:
  linux:
  macos:
  windows:
  web:
topics:
  - shaders
  - shadertoy

environment:
  sdk: ^3.13.2
  # 3.47.0 is the first stable carrying the Flutter GPU support this package
  # needs (render-to-mip-level, flutter/flutter#187685), so the floor is a
  # truthful minimum rather than the pana-scoring compromise it used to be.
  # Master builds numbered 3.47.0-1.0.pre.N sort below it and are excluded.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_recorder: ^2.0.5
    # path: ../flutter_recorder
  flutter_scene: ^0.23.0
    # path: ../../tmp/flutter_scene/packages/flutter_scene
  flutter_soloud: ^5.1.2
    # path: ../flutter_soloud
  flat_buffers: ^25.9.23
  image: ^4.10.1
  listen: ^1.0.1
  vector_math: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Waiting for flutter_scene 0.24.0 to remove this
  code_assets: ^2.0.0

flutter:
  assets:
    - flutter_scene_generated/
