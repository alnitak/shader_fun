name: shader_fun
description: >-
  Run and experiment with Shadertoy GLSL shaders in Flutter. Features
  multi-pass ping-pong buffers, audio/mic reactive visualizers, 
  GPU sounds, and live interactive widget textures.
version: 1.0.3
homepage: https://github.com/alnitak/shader_fun
maintainer: Marco Bavagnoli (@alnitak)
platforms:
  android:  
  ios:
  linux:
  macos:
  windows:
  web:
topics:
  - shaders
  - shadertoy
  - glsl
  - flutter-gpu
  - gpu-sound

environment:
  sdk: ^3.13.2
  # 3.47.0 is the first stable carrying the Flutter GPU support this package
  # needs (render-to-mip-level, flutter/flutter#187685), so the floor is a
  # truthful minimum rather than the pana-scoring compromise it used to be.
  # Master builds numbered 3.47.0-1.0.pre.N sort below it and are excluded.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_recorder: ^2.0.8
    # path: ../flutter_recorder
  flutter_scene: ^0.24.5
    # path: ../../tmp/flutter_scene/packages/flutter_scene
  flutter_soloud: ^5.3.2
    # path: ../flutter_soloud
  flat_buffers: ^25.9.23
  hooks: ^2.0.0
  image: ^4.13.1
  listen: ^1.0.1
  material_ui: ^1.11.1
  vector_math: ^2.4.4
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - flutter_scene_generated/
